services:
  web:
    image: node:22
    working_dir: /workspace/web
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        exec npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ${BASE44_PROJECT_ROOT}:/workspace
      - web_node_modules:/workspace/web/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  web_node_modules:
