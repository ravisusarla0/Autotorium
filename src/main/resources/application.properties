spring.application.name=autotorium

# Web entry point
server.port=${PORT:3000}
server.address=0.0.0.0

# Embedded H2 database (file backed so garage builds and shop tickets survive restarts)
spring.datasource.url=jdbc:h2:file:${AUTOTORIUM_DB_PATH:./data/autotorium};DB_CLOSE_DELAY=-1;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# schema.sql / data.sql are idempotent and re-applied on boot
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Static SPA is served straight from src/main/resources/static
spring.web.resources.cache.period=0
spring.mvc.problemdetails.enabled=false
